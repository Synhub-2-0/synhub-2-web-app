<section class="mb-7 flex items-center gap-4" *ngIf="totalCount() > 0">
  <label class="text-[0.95rem] font-semibold text-slate-700">
    Estado:
    <select [(ngModel)]="filter" class="ml-2 cursor-pointer rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-[0.95rem] text-slate-900 shadow-sm transition-all duration-200 hover:border-blue-600 hover:shadow-[0_2px_6px_rgba(37,99,235,0.2)] focus:border-blue-600 focus:outline-none focus:ring-1 focus:ring-blue-600">
      <option *ngFor="let s of statusOptions" [ngValue]="s">{{ labelFor(s) }}</option>
    </select>
  </label>
</section>

<ng-container *ngIf="totalCount() === 0; else tasksTpl">
  <div class="flex min-h-[calc(100vh-120px)] items-center justify-center p-6">
    <div class="inline-block rounded-2xl bg-[#174a7c] px-12 py-7 text-center text-[1.6rem] font-bold text-white shadow-[0_8px_24px_rgba(0,0,0,0.18)]">No tienes tareas asignadas</div>
  </div>
</ng-container>

<ng-template #tasksTpl>
  <section class="grid grid-cols-1 gap-6 lg:grid-cols-2">
    <member-task-item
      *ngFor="let t of filtered()"
      [task]="t"
      (changed)="load()">
    </member-task-item>
  </section>
</ng-template>
