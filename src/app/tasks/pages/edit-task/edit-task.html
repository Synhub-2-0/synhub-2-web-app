<section class="mb-4 rounded-2xl border border-dashed border-slate-300 bg-slate-50 p-4">
  <h3 class="mb-3 text-xl font-bold text-slate-800">Editar tarea</h3>

  <div *ngIf="loading" class="p-3 text-slate-500">Cargando…</div>

  <form *ngIf="!loading" class="grid grid-cols-1 gap-3.5" (ngSubmit)="save()">
    <div class="grid gap-1.5">
      <label class="font-semibold text-slate-700">Título</label>
      <input class="w-full rounded-xl border border-slate-300 bg-white px-3.5 py-3 text-slate-900 shadow-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" [(ngModel)]="title" name="title" placeholder="Título" />
    </div>

    <div class="grid gap-1.5">
      <label class="font-semibold text-slate-700">Descripción</label>
      <textarea class="min-h-[110px] w-full resize-y rounded-xl border border-slate-300 bg-white px-3.5 py-3 text-slate-900 shadow-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" [(ngModel)]="description" name="description" rows="4" placeholder="Descripción"></textarea>
    </div>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Asignar a</mat-label>
      <mat-select [(ngModel)]="memberId" name="memberId">
        <mat-select-trigger>
          <span class="pointer-events-none inline-flex select-none items-center gap-2 align-middle">
            <ng-container *ngIf="selectedMember; else noneTpl">
              <img class="h-[22px] w-[22px] rounded-full object-cover" [src]="imgFor(selectedMember)" alt="avatar seleccionado" />
              <span class="max-w-[280px] overflow-hidden text-ellipsis whitespace-nowrap">{{ memberLabel(selectedMember!) }}</span>
            </ng-container>
            <ng-template #noneTpl>
              <span class="text-slate-500">Sin asignar</span>
            </ng-template>
          </span>
        </mat-select-trigger>

        <mat-option [value]="undefined">Sin asignar</mat-option>
        <mat-option *ngFor="let m of members" [value]="m.id">
          <div class="flex items-center gap-2.5">
            <img class="h-6 w-6 rounded-full object-cover" [src]="imgFor(m)" alt="avatar miembro" />
            <span class="max-w-full overflow-hidden text-ellipsis whitespace-nowrap">{{ memberLabel(m) }}</span>
          </div>
        </mat-option>
      </mat-select>
    </mat-form-field>

    <div class="grid gap-1.5">
      <label for="due" class="font-semibold text-slate-700">Fecha de vencimiento</label>
      <input id="due" class="w-full rounded-xl border border-slate-300 bg-white px-3.5 py-3 text-slate-900 shadow-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" type="datetime-local" [(ngModel)]="dueDateTime" name="dueDateTime" />
    </div>

    <div class="mt-2 flex justify-center gap-4">
      <button type="submit" class="inline-flex cursor-pointer items-center gap-2 rounded-xl border-none bg-green-600 px-5 py-3 font-bold text-white shadow-md transition-all duration-150 hover:-translate-y-[1px] hover:shadow-lg focus:outline-none disabled:opacity-70" [disabled]="saving">
        <svg viewBox="0 0 24 24" class="h-[18px] w-[18px] fill-white">
          <path d="M17,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V7L17,3M12,19A3.5,3.5 0 0,1 8.5,15.5A3.5,3.5 0 0,1 12,12A3.5,3.5 0 0,1 15.5,15.5A3.5,3.5 0 0,1 12,19M6,8V5H16V8H6Z"/>
        </svg>
        Guardar
      </button>

      <button type="button" class="inline-flex cursor-pointer items-center gap-2 rounded-xl border-none bg-red-600 px-5 py-3 font-bold text-white shadow-md transition-all duration-150 hover:-translate-y-[1px] hover:shadow-lg focus:outline-none" (click)="cancel()">
        <svg viewBox="0 0 24 24" class="h-[18px] w-[18px] fill-white">
          <path d="M12,2A10,10 0 1,0 22,12A10,10 0 0,0 12,2M15.59,7.58L12,11.17L8.41,7.58L7,9L10.59,12.59L7,16.17L8.41,17.58L12,14L15.59,17.58L17,16.17L13.41,12.59L17,9"/>
        </svg>
        Cancelar
      </button>
    </div>
  </form>
</section>
