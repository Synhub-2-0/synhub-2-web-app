<article class="flex cursor-pointer flex-col gap-3 rounded-[18px] border border-slate-200 bg-slate-50 p-[18px] shadow-[0_2px_8px_rgba(0,0,0,0.06)] transition-shadow hover:shadow-[0_6px_16px_rgba(0,0,0,0.10)]" (click)="open()">
  <header class="flex items-center justify-between gap-3">
    <h3 class="m-0 min-w-0 flex-1 overflow-hidden text-ellipsis whitespace-nowrap text-[1.2rem] font-bold text-slate-800">{{ task.title }}</h3>
    <span class="rounded-full bg-slate-100 px-2.5 py-1.5 text-[0.85rem] font-semibold text-slate-700">{{ task.status }}</span>
  </header>

  <div class="h-[2px] rounded-sm bg-slate-200"></div>

  <p class="min-h-[90px] rounded-xl border border-slate-200 bg-white p-3 text-slate-900 shadow-sm">{{ task.description || 'Sin descripción' }}</p>

  <div class="grid justify-items-center">
    <span class="text-[0.9rem] text-slate-500" *ngIf="task.dueDate">Fecha de entrega: {{ task.dueDate | date:'dd/MM/yyyy' }}</span>
  </div>

  <div class="h-2.5 w-full overflow-hidden rounded-full bg-slate-200">
    <div class="h-full w-full" [ngClass]="progressClass"></div>
  </div>

  <div class="grid justify-items-center">
    <span class="text-[0.9rem] text-slate-500">Tiempo restante: {{ remainingLabel }}</span>
  </div>

  @if (task.status === 'IN_PROGRESS') {
    <footer class="mt-2 grid grid-cols-1 gap-3">
      <!-- bg-amber-700 para pasar accesibilidad -->
      <button type="button" class="appearance-none cursor-pointer rounded-full border-none bg-amber-700 px-[18px] py-3 font-bold text-white shadow-md transition-all hover:-translate-y-[1px] hover:shadow-lg" (click)="$event.stopPropagation(); goComment()">
        Enviar un comentario
      </button>
      <!-- bg-green-700 para pasar accesibilidad -->
      <button type="button" class="appearance-none cursor-pointer rounded-full border-none bg-green-700 px-[18px] py-3 font-bold text-white shadow-md transition-all hover:-translate-y-[1px] hover:shadow-lg" (click)="$event.stopPropagation(); markDone()">
        Marcar como completada
      </button>
    </footer>
  }
</article>
