<div class="p-6 max-w-sm text-center">
  <h2 class="text-lg font-extrabold text-slate-800 mb-2">{{ data.title || 'Eliminar tarea' }}</h2>
  <p class="text-sm text-slate-600 mb-6 leading-relaxed">{{ data.message }}</p>
  <div class="flex gap-3 justify-center">
    <button
      type="button"
      (click)="cancel()"
      class="flex-1 rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-bold text-slate-600 hover:bg-slate-50 cursor-pointer">
      {{ data.cancelText || 'Cancelar' }}
    </button>
    <button
      type="button"
      (click)="ok()"
      class="flex-1 rounded-xl bg-red-600 hover:bg-red-700 px-4 py-2.5 text-sm font-bold text-white shadow-sm cursor-pointer">
      {{ data.okText || 'Eliminar' }}
    </button>
  </div>
</div>
