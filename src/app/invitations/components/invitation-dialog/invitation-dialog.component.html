<div class="flex flex-col items-center justify-center p-6 text-center max-w-sm">
  <div class="mb-6">
    <h3 class="text-lg font-extrabold text-slate-800 mb-2">Confirmar Ingreso</h3>
    <p class="text-sm text-slate-600 leading-relaxed">
      Estás por aceptar a <strong class="text-[#1A4E85]">{{ invitation.user.name }} {{ invitation.user.surname }}</strong> (&#64;{{ invitation.user.username }}) en el grupo <strong>{{ invitation.group.name }}</strong>.
    </p>
  </div>

  <div class="flex w-full flex-row justify-around gap-3">
    <button
      (click)="onNoClick()"
      [disabled]="loading"
      class="w-full cursor-pointer rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-bold text-slate-600 hover:bg-slate-50 transition">
      Cancelar
    </button>
    <button
      (click)="onAcceptRequest()"
      [disabled]="loading"
      class="w-full cursor-pointer rounded-xl bg-emerald-600 hover:bg-emerald-700 px-4 py-2.5 text-sm font-bold text-white shadow-sm transition disabled:opacity-50">
      {{ loading ? 'Aceptando...' : 'Aceptar' }}
    </button>
  </div>
</div>
