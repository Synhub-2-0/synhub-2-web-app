<div class="w-full">
  @if (invitations.length === 0) {
    <p class="text-slate-500 italic text-lg py-4">No tienes invitaciones pendientes.</p>
  }
  
  @if (invitations.length > 0) {
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      @for (invitation of invitations; track invitation.id) {
        <app-invitation
          [invitation]="invitation"
          (invitationChanged)="reloadInvitations()"
        ></app-invitation>
      }
    </div>
  }
</div>
