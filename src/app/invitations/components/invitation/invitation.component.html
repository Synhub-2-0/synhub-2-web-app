<div class="flex flex-col justify-between gap-5 rounded-2xl bg-slate-50 border border-slate-200 p-5 hover:border-[#b8daff] transition-all">
  <!-- Información del Usuario (invitation.user) -->
  <div class="flex items-center gap-4">
    <img
      [src]="invitation.user.imgUrl"
      [alt]="invitation.user.name"
      class="h-14 w-14 rounded-full object-cover border border-slate-200 shadow-sm shrink-0" />
    <div class="min-w-0 flex-1">
      <p class="text-base font-bold text-slate-800 truncate">
        {{ invitation.user.name }} {{ invitation.user.surname }}
      </p>
      <p class="text-xs text-slate-500 truncate">&#64;{{ invitation.user.username }}</p>
      <p class="text-[11px] text-slate-400 truncate mt-0.5">{{ invitation.user.email }}</p>
    </div>
  </div>

  <!-- Acciones: Aceptar (POST /invitations/accept) o Rechazar (DELETE /invitations/{id}) -->
  <div class="grid grid-cols-2 gap-3 pt-2 border-t border-slate-200/70">
    <button
      (click)="openDialog()"
      [disabled]="processing"
      class="flex items-center justify-center gap-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 px-4 py-2.5 text-xs font-bold text-white shadow-sm transition cursor-pointer disabled:opacity-50">
      <mat-icon class="scale-75">check</mat-icon>
      <span>Aceptar</span>
    </button>
    <button
      (click)="onRejectRequest()"
      [disabled]="processing"
      class="flex items-center justify-center gap-1.5 rounded-xl bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2.5 text-xs font-bold transition cursor-pointer disabled:opacity-50">
      <mat-icon class="scale-75">close</mat-icon>
      <span>Rechazar</span>
    </button>
  </div>
</div>
