<div class="flex flex-col gap-4 rounded-xl bg-slate-100 p-4 shadow-[0_4px_12px_rgba(0,0,0,0.15)]">
  
  <!-- Info del Miembro -->
  <div class="flex items-center gap-5 rounded-lg bg-[#1A4E85] p-4 text-white">
    <img [src]="invitation.member.imgUrl" class="h-10 w-10 rounded-full object-cover shadow-sm">
    <div class="flex flex-col">
      <p class="m-0 text-lg font-semibold">{{invitation.member.name}} {{invitation.member.surname}}</p>
      <p class="m-0 text-sm text-slate-300">{{invitation.member.username}}</p>
    </div>
  </div>
  
  <!-- Botones de Acción -->
  <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
    <button class="flex w-full sm:w-auto items-center justify-center gap-2 rounded-lg border-none bg-green-600 px-5 py-2.5 text-base font-bold text-white shadow-md transition-transform hover:-translate-y-[1px] hover:shadow-lg cursor-pointer" (click)="openDialog()">
      <span class="material-icons text-[20px]">check</span>
      <span>Aceptar</span>
    </button>
    <button class="flex w-full sm:w-auto items-center justify-center gap-2 rounded-lg border-none bg-red-500 px-5 py-2.5 text-base font-bold text-white shadow-md transition-transform hover:-translate-y-[1px] hover:shadow-lg cursor-pointer" (click)="onRejectRequest()">
      <span class="material-icons text-[20px]">cancel</span>
      <span>Rechazar</span>
    </button>
  </div>

</div>
