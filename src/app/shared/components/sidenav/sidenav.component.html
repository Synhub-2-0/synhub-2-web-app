<div
  class="fixed top-0 left-0 z-50 flex h-screen flex-col overflow-x-hidden bg-[#1A4E85] transition-all duration-500 ease-in-out"
  [ngClass]="collapsed ? 'w-[16.5625rem] translate-x-0 shadow-2xl md:shadow-none' : '-translate-x-full w-[16.5625rem] md:w-20 md:translate-x-0'"
>
  <!-- Contenedor del Logo -->
  <div class="flex w-full items-center p-[0.938rem]">
    <button
      class="flex h-12 w-12 min-w-[3rem] cursor-pointer items-center justify-center rounded-[0.313rem] border-none bg-white text-2xl font-black text-[#1A4E85] focus:outline-none"
      (click)="toggleCollapse()">
      S
    </button>
    @if (collapsed) {
      <div class="ml-6 whitespace-nowrap text-2xl font-bold text-white" @fadeInOut>{{ fullName }}</div>
      <button class="ml-auto h-8 w-8 cursor-pointer rounded-full border-none bg-transparent" (click)="closeSidenav()">
        <i class="fas fa-times text-2xl text-white"></i>
      </button>
    }
  </div>

  <!-- Foto de Perfil -->
  @if (collapsed) {
    <div class="flex items-center justify-center border-b-2 border-white py-5" @fadeInOut>
      <img [src]="pfpUrl" alt="User Profile Picture" class="h-36 w-36 rounded-full object-cover" />
    </div>
  }

  <!-- Navegación Principal -->
  <ul class="m-0 flex w-full flex-1 flex-col items-center list-none overflow-y-auto overflow-x-hidden p-[0.938rem]">
    @for (data of navData; track data.title) {
      <li class="mb-[0.625rem] w-full">
        <a
          class="group flex h-12 items-center rounded-[0.625rem] no-underline transition-colors duration-300 ease-in-out hover:bg-white hover:text-[#1A4E85]"
          [routerLink]="[data.path]"
          routerLinkActive="bg-white font-semibold"
          #rla="routerLinkActive"
          [ngClass]="rla.isActive ? 'text-black' : 'text-[#f3f3f3]'"
          [routerLinkActiveOptions]="{exact: true}"
        >
          @if (data.svg) {
            <span
              class="mx-2 flex w-8 min-w-[2rem] items-center justify-center text-center text-[22px] group-hover:text-[#1A4E85]"
              [innerHTML]="data.svg"
              [ngClass]="rla.isActive ? 'text-black' : ''"
            ></span>
          }
          @if (collapsed) {
            <span class="ml-4 whitespace-nowrap group-hover:text-[#1A4E85]" @fadeInOut>{{data.title}}</span>
          }
        </a>
      </li>
    }
  </ul>

  <!-- Sección de Cerrar Sesión -->
  @if (collapsed) {
    <div class="mt-auto border-t-2 border-white">
      <ul class="m-0 flex w-full flex-col items-center list-none p-[0.938rem]">
        <li class="w-full">
          <a
            class="group flex h-12 items-center rounded-[0.625rem] no-underline transition-colors duration-300 ease-in-out hover:bg-white hover:text-[#1A4E85]"
            [routerLink]="[LOGOUT_OPTION.path]"
            routerLinkActive="bg-white font-semibold"
            #rlaLogout="routerLinkActive"
            [ngClass]="rlaLogout.isActive ? 'text-black' : 'text-[#f3f3f3]'"
            [routerLinkActiveOptions]="{exact: true}"
          >
            @if (LOGOUT_OPTION.svg) {
              <span
                class="mx-2 flex w-8 min-w-[2rem] items-center justify-center text-center text-[22px] group-hover:text-[#1A4E85]"
                [innerHTML]="LOGOUT_OPTION.svg"
                [ngClass]="rlaLogout.isActive ? 'text-black' : ''"
              ></span>
            }
            <span class="ml-4 whitespace-nowrap group-hover:text-[#1A4E85]" @fadeInOut>{{LOGOUT_OPTION.title}}</span>
          </a>
        </li>
      </ul>
    </div>
  }
</div>
